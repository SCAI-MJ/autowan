[project]
name = "autowan"
version = "0.1.0"
requires-python = ">=3.10"
description = "A physics-gated agentic workflow for Wannier function construction"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.urls]
Repository = "https://github.com/SCAI-MJ/autowan"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
autowan = "autowan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autowan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
